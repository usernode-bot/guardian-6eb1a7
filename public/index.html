<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Guardian</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://social-vibecoding.usernodelabs.org/usernode-bridge/v1/bridge.js"></script>
</head>
<body>
  <div id="app">
    <h1>Guardian</h1>
    <p>Welcome to Guardian dapp.</p>
  </div>
  <script src="/app.js"></script>
  <!-- usernode-dev-console@1 -->
  <script>
    (function() {
      const originalLog = console.log;
      const originalError = console.error;
      const originalWarn = console.warn;

      function forwardConsole(level, args) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'console',
            level: level,
            message: Array.from(args).map(arg =>
              typeof arg === 'string' ? arg : JSON.stringify(arg)
            ).join(' ')
          }, '*');
        }
      }

      console.log = function(...args) {
        originalLog.apply(console, args);
        forwardConsole('log', args);
      };

      console.error = function(...args) {
        originalError.apply(console, args);
        forwardConsole('error', args);
      };

      console.warn = function(...args) {
        originalWarn.apply(console, args);
        forwardConsole('warn', args);
      };

      window.addEventListener('error', (event) => {
        forwardConsole('error', [event.message]);
      });
    })();
  </script>
</body>
</html>
